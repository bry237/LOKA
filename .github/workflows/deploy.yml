name: Déploiement LOKA

on:
  push:
    # Déploie depuis `odyssee` (branche de travail solo), pas `main` (branche
    # partagée avec l'équipe — main a du travail des coéquipiers pas encore
    # fusionné ici, pas question d'y toucher juste pour tester le pipeline).
    # À changer pour `main` le jour où ce travail y est fusionné via le
    # processus d'équipe normal (PR, etc.).
    branches: [odyssee]
  workflow_dispatch: {}

jobs:
  lint:
    name: Vérification PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Lint de tous les fichiers PHP
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Installation des dépendances Composer (vérification)
        run: composer install --no-dev --prefer-dist --no-progress

  deploy:
    name: Déploiement FTP
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      # L'hébergeur mutualisé n'a pas Composer (pas d'accès shell) : on construit
      # vendor/ ici, dans le pipeline, puis on l'envoie avec le reste par FTP.
      - name: Installation des dépendances Composer
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Déploiement FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP simple, pas FTPS : incompatibilité connue entre cette action
          # et le FTPS d'InfinityFree ("Server sent FIN packet unexpectedly").
          # Acceptable ici — aucun secret ne transite par ce canal,
          # config/env.local.php (identifiants base de données) est exclu
          # de l'envoi automatique, voir plus bas.
          protocol: ftp
          port: 21
          server-dir: /htdocs/LOKA/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github/**/*
            deploy/**
            database/backups/**
            config/env.local.php
            config/env.local.php.example
